name: Windows Release
# Builds kopia.exe, KopiaUI-Wails.exe and the NSIS installer on Windows.
#
# - Pushing a tag v* publishes a GitHub release with the installer, a portable
#   zip and checksums.txt (which `kopia` update checks read).
# - Running the workflow manually builds the same files as a workflow artifact
#   without publishing a release.
on:
  push:
    tags:
      - v*
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: |
          go.sum
          app-wails/go.sum
    - name: Install NSIS
      run: choco install --no-progress -y nsis
    - name: Compute version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
        else
          VERSION="$(date -u +%Y%m%d).0.0-$(git rev-parse --short=8 HEAD)"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "Version: $VERSION"
    - name: Build kopia.exe
      run: |
        go build -trimpath \
          -ldflags "-s -w -X github.com/kopia/kopia/repo.BuildVersion=$VERSION -X github.com/kopia/kopia/repo.BuildInfo=$GITHUB_SHA -X github.com/kopia/kopia/repo.BuildGitHubRepo=$GITHUB_REPOSITORY" \
          -o dist/kopia_windows_amd64/kopia.exe github.com/kopia/kopia
        dist/kopia_windows_amd64/kopia.exe --version
    - name: Build KopiaUI-Wails and installer
      env:
        MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
      run: app-wails/build-installer.sh
    - name: Package release files
      run: |
        mkdir -p release
        cp "dist/KopiaUI-Wails-Setup-$VERSION.exe" release/
        PORTABLE="KopiaUI-Wails-$VERSION-windows-x64"
        mkdir -p "dist/$PORTABLE"
        cp dist/kopiaui-wails/KopiaUI-Wails.exe dist/kopiaui-wails/kopia.exe LICENSE README.md "dist/$PORTABLE/"
        (cd dist && 7z a -tzip "../release/$PORTABLE.zip" "$PORTABLE" > /dev/null)
        (cd release && sha256sum * > checksums.txt)
        cat release/checksums.txt
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kopiaui-wails-windows-${{ env.VERSION }}
        path: release/
        if-no-files-found: error
    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" release/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "$GITHUB_REF_NAME" \
          --generate-notes
